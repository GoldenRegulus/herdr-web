[project]
name = "herdr-web"
version = "0.1.0"
description = "A local browser terminal for Herdr sessions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "tomli>=2.0; python_version < '3.11'",
  "uvicorn[standard]>=0.27",
]

[project.scripts]
herdr-web = "herdr_web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["herdr_web"]
