<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Herdr Web</title>
    <link rel="icon" href="data:," />
    <script>
      const pagePath = window.location.pathname;
      window.herdrWebBasePath = pagePath.endsWith('/') ? pagePath : `${pagePath}/`;
      const stylesheet = document.createElement('link');
      stylesheet.rel = 'stylesheet';
      stylesheet.href = `${window.herdrWebBasePath}static/style.css`;
      window.herdrWebStylesheetReady = new Promise((resolve, reject) => {
        stylesheet.addEventListener('load', resolve, { once: true });
        stylesheet.addEventListener('error', reject, { once: true });
      });
      document.head.append(stylesheet);
    </script>
  </head>
  <body>
    <main>
      <section id="picker" aria-labelledby="title">
        <h1 id="title">Herdr</h1>
        <p class="muted">Select a running session on this host.</p>
        <div id="backends" class="backends" aria-live="polite"></div>
        <p id="picker-error" class="error" hidden></p>
        <div class="picker-actions">
          <button id="refresh" type="button">Refresh</button>
          <button id="add-session" type="button">Add</button>
        </div>
      </section>
      <div id="web-toasts" aria-live="polite" aria-atomic="true"></div>
      <section id="terminal-view" hidden>
        <header>
          <strong id="backend-name"></strong>
          <button id="back" type="button">Back to sessions</button>
        </header>
        <aside id="telemetry" aria-live="polite">
          <span id="connection-indicator" data-state="connecting"></span>
          <span id="connection-status">Connecting…</span>
          <span id="fps">-- FPS</span>
        </aside>
        <div id="terminal" aria-label="Herdr terminal"></div>
      </section>
    </main>

    <script type="module">
      window.herdrWebStylesheetReady
        .then(() => import(`${window.herdrWebBasePath}static/app.js`))
        .catch((error) => {
          const pickerError = document.querySelector('#picker-error');
          pickerError.textContent = `Could not load the terminal: ${error.message}`;
          pickerError.hidden = false;
        });
    </script>
  </body>
</html>
